<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JoyBridge - International Convention Language Helper</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .phrase-card { transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .phrase-card:hover { transform: translateY(-2px); }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="goToHome()">
        <span class="text-2xl">🌉</span>
        <div>
          <h1 class="text-xl font-bold tracking-tight">JoyBridge</h1>
          <p class="text-xs text-indigo-200">Eternal Happiness Convention Helper</p>
        </div>
      </div>
      <button id="homeBtn" onclick="goToHome()" class="hidden text-sm bg-indigo-800 hover:bg-indigo-900 px-3 py-1.5 rounded-lg border border-indigo-500 transition">
        <i class="fa-solid fa-earth-americas mr-1"></i> Languages
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-grow max-w-4xl mx-auto w-full p-4 md:p-6">

    <!-- Screen 1: Language Selection -->
    <section id="languageScreen" class="space-y-6">
      <div class="text-center py-4">
        <h2 class="text-2xl font-bold text-slate-900">Choose a Language</h2>
        <p class="text-slate-600 mt-1">Select a delegate's language to begin communicating</p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-2 gap-4">
        <button onclick="selectLanguage('dutch')" class="p-5 bg-white border border-slate-200 rounded-xl shadow-sm hover:border-indigo-500 hover:shadow-md transition text-left flex items-center justify-between group">
          <div>
            <span class="text-lg font-bold text-slate-900 group-hover:text-indigo-600">Nederlands</span>
            <span class="text-slate-500 font-medium ml-1">(Dutch)</span>
          </div>
          <span class="text-2xl">🇳🇱</span>
        </button>

        <button onclick="selectLanguage('polish')" class="p-5 bg-white border border-slate-200 rounded-xl shadow-sm hover:border-indigo-500 hover:shadow-md transition text-left flex items-center justify-between group">

            <span class="text-lg font-bold text-slate-900 group-hover:text-indigo-600">Polski</span>
            <span class="text-slate-500 font-medium ml-1">(Polish)</span>

          <span class="text-2xl">🇵🇱</span>
        </button>

            <span class="text-slate-500 font-medium ml-1">(German)</span>

          <span class="text-2xl">🇩🇪</span>

            <span class="text-slate-500 font-medium ml-1">(Kannada)</span>
          </div>
          <span class="text-2xl">🇮🇳</span>
        </button>

        <button onclick="selectLanguage('konkani')" class="p-5 bg-white border border-slate-200 rounded-xl shadow-sm hover:border-indigo-500 hover:shadow-md transition text-left flex items-center justify-between group">
          <div>
            <span class="text-lg font-bold text-slate-900 group-hover:text-indigo-600">ಕೊಂಕಣಿ</span>
            <span class="text-slate-500 font-medium ml-1">(Konkani)</span>
          </div>
          <span class="text-2xl">🇮🇳</span>
        </button>

        <button onclick="selectLanguage('korean')" class="p-5 bg-white border border-slate-200 rounded-xl shadow-sm hover:border-indigo-500 hover:shadow-md transition text-left flex items-center justify-between group">
          <div>

            <span class="text-slate-500 font-medium ml-1">(Korean)</span>
          </div>
          <span class="text-2xl">🇰🇷</span>
        </button>

          </div>
          <span class="text-2xl">🇸🇮</span>
        </button>

        <button onclick="selectLanguage('french')" class="p-5 bg-white border border-slate-200 rounded-xl shadow-sm hover:border-indigo-500 hover:shadow-md transition text-left flex items-center justify-between group">
          <div>
            <span class="text-lg font-bold text-slate-900 group-hover:text-indigo-600">Français</span>
            <span class="text-slate-500 font-medium ml-1">(French)</span>
          </div>
          <span class="text-2xl">🇫🇷</span>
        </button>
      </div>
    </section>

    <!-- Screen 2: Language Detail -->
    <section id="detailScreen" class="hidden space-y-5">
      <!-- Top Language Banner -->
      <div class="flex items-center justify-between bg-indigo-50 border border-indigo-100 p-4 rounded-xl">
        <div class="flex items-center space-x-3">
          <span id="detailFlag" class="text-3xl"></span>
          <div>
            <h2 id="detailLangName" class="text-xl font-bold text-indigo-950"></h2>
            <p id="detailLangSub" class="text-xs text-indigo-700"></p>
          </div>
        </div>
        <button onclick="goToHome()" class="text-xs font-semibold text-indigo-700 hover:text-indigo-900 bg-white px-3 py-1.5 rounded-lg border border-indigo-200 shadow-sm">
          Change Language
        </button>
      </div>

      <!-- Category Buttons -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-2" id="categoryContainer"></div>

      <!-- Mode Tabs -->
      <div class="flex bg-slate-200 p-1 rounded-xl font-medium text-sm">
        <button id="tabNative" onclick="setMode('native')" class="flex-1 py-2.5 rounded-lg transition text-center shadow-sm">
          <span id="tabNativeText"></span>
        </button>
        <button id="tabEnglish" onclick="setMode('english')" class="flex-1 py-2.5 rounded-lg transition text-center text-slate-600">
          ENGLISH
        </button>
      </div>

      <!-- Quick Explanation Bar -->
      <p id="modeDescription" class="text-xs text-slate-500 italic text-center px-2"></p>

      <!-- Phrase Cards List -->
      <div id="phrasesList" class="space-y-3 pb-8"></div>
    </section>

  </main>

            { en: "We’re inviting people to try a free Bible lesson.", tr: "ಆಮಿ ಲೊಕಾಂಕ್ ಏಕ್ ಪುಕ್ಕಟ್ ಬೈಬಲ್ ಪಾಠ್ ಚಾಕುನ್ ಪಳೆಂವ್ಕ್ ಆಪಯ್ತಾಂವ್.", phNative: "ವಿ ಆರ್ ಇನ್ವೈಟಿಂಗ್ ಪೀಪಲ್ ಟು ಟ್ರೈ ಎ ಫ್ರೀ ಬೈಬಲ್ ಲೆಸನ್.", phEng: "AH-mee loh-KAHNK ayk pook-KUHT BY-buhl PAHTH chah-koon puh-lyevnk ah-poy-TAHMV." },
            { en: "Have you ever tried studying the Bible?", tr: "ತುಮಿ ಕೆದ್ನಾಂಯ್ ಬೈಬಲ್ ವಾಚುನ್ ಕಳಿತ್ ಕರ್ನ್ ಘೆಂವ್ಕ್ ಪಳೆಲಾಂವೇ?", phNative: "ಹ್ಯಾವ್ ಯು ಎವರ್ ಟ್ರೈಡ್ ಸ್ಟಡಿಯಿಂಗ್ ದ ಬೈಬಲ್?", phEng: "too-MEE ked-NAHNY BY-buhl vah-CHOON kuh-LEET kurn ghemvk puh-lyay-lahm-VAY?" },
            { en: "This course can help you understand the Bible.", tr: "ಹ್ಯಾ ಕೋರ್ಸಾ ವರ್ವಿಂ ತುಮ್ಕಾಂ ಬೈಬಲ್ ಸಮ್ಜೊಂಕ್ ಕುಮೊಕ್ ಮೆಳ್ತಲಿ.", phNative: "ದಿಸ್ ಕೋರ್ಸ್ ಕ್ಯಾನ್ ಹೆಲ್ಪ್ ಯು ಅಂಡರ್‌ಸ್ಟಾಂಡ್ ದ ಬೈಬಲ್.", phEng: "hyah kohr-SAH vur-VEEM toom-KAHM BY-buhl sum-JONK koo-mohk mel-TUH-lee." },
            { en: "It answers important questions about life and the future.", tr: "ಜಿವಿತಾಚ್ಯಾ ಆನಿ ಮುಖ್ಲ್ಯಾ ಕಾಳಾಚ್ಯಾ ಗಂಭೀರ್ ಸವಾಲಾಂಕ್ ಹೊ ಜಾಪ್ ದಿತಾ.", phNative: "ಇಟ್ ಆನ್ಸರ್ಸ್ ಇಂಪಾರ್ಟೆಂಟ್ ಕ್ವೆಶ್ಚನ್ಸ್ ಅಬೌಟ್ ಲೈಫ್ ಅಂಡ್ ದ ಫ್ಯೂಚರ್.", phEng: "jee-vee-tah-CHYAH ah-NEE mookh-LYAH kah-wah-CHYAH gum-BHEER suh-vah-lahnk hoh JAHP dee-TAH." },
            { en: "There is no charge and no obligation.", tr: "ಹಾಕಾ ಕಾಂಯ್ ಖರ್ಚ್ ನಾ ಆನಿ ಕಸಲೆಂಯ್ ಬಂಧನ್ ನಾ.", phNative: "ದೇರ್ ಈಸ್ ನೋ ಚಾರ್ಜ್ ಅಂಡ್ ನೋ ಆಬ್ಲಿಗೇಷನ್.", phEng: "HAH-kah kahny KHURCH nah ah-nee kuh-suh-lemy bun-DHUN nah." },
            { en: "You can choose the time and place.", tr: "ತುಮಿಚ್ ವೇಳ್ ಆನಿ ಜಾಗೊ ವಿಂಚ್ಯೆತ್.", phNative: "ಯು ಕ್ಯಾನ್ ಚೂಸ್ ದ ಟೈಮ್ ಅಂಡ್ ಪ್ಲೇಸ್.", phEng: "too-MEECH vayl ah-NEE jah-GOH veen-chyet." },
            { en: "It can be done in person or by video call.", tr: "ಹೆಂ ಖುದ್ದ್ ಮೆಳುನ್ ವಾ ವಿಡಿಯೋ ಕೊಲ್ ಮುಖಾಂತ್ರ್ ಕರ್ಯೆತ್.", phNative: "ಇಟ್ ಕ್ಯಾನ್ ಬಿ ಡನ್ ಇನ್ ಪರ್ಸನ್ ಆರ್ ಬೈ ವಿಡಿಯೋ ಕಾಲ್.", phEng: "hem KHOOD-doo meh-WOON vah VEE-dee-yoh kohl moo-KHAHN-truh kur-yet." },
            { en: "Even a few minutes each week is fine.", tr: "ಹರ್ಯೆಕಾ ಸಪ್ತ್ಯಾಕ್ ಕೇವಲ್ ಥೊಡಿಂಚ್ ಮಿನುಟಾಂ ಪುರೊ.", phNative: "ಈವನ್ ಎ ಫ್ಯೂ ಮಿನಿಟ್ಸ್ ಈಚ್ ವೀಕ್ ಈಸ್ ಫೈನ್.", phEng: "hur-yay-KAH suhp-TYAHK kay-VUHL thoh-deemch mee-noo-TAHM poo-ROH." },
            { en: "May I show you how the course works?", tr: "ಹೊ ಕೋರ್ಸ್ ಕಸೊ ಚಲ್ತಾ ಮ್ಹಣ್ ಹಾಂವ್ ತುಮ್ಕಾಂ ದಾಕಂವ್ವೇ?", phNative: "ಮೇ ಐ ಶೋ ಯು ಹೌ ದ ಕೋರ್ಸ್ ವರ್ಕ್ಸ್?", phEng: "hoh kohrs kuh-SOH chuhl-TAH mhun HAHMV toom-KAHM dah-kuhmv-VAY?" },
            { en: "This demonstration will take only a few minutes.", tr: "ಹೆಂ ದಾಕಂವ್ಕ್ ಕೇವಲ್ ಥೊಡಿಂಚ್ ಮಿನುಟಾಂ ಲಾಗ್ತೆಲಿಂ.", phNative: "ದಿಸ್ ಡೆಮೊನ್‌ಸ್ಟ್ರೇಷನ್ ವಿಲ್ ಟೇಕ್ ಓನ್ಲಿ ಎ ಫ್ಯೂ ಮಿನಿಟ್ಸ್.", phEng: "hem dah-kuhmvk kay-VUHL thoh-deemch mee-noo-TAHM lahg-teh-LEEM." }
          ]
        }

    let currentLangKey = 'german';
    let currentCategory = 'greetings';
    let currentMode = 'native'; // 'native' = Left Tab, 'english' = Right Tab

    function goToHome() {
      document.getElementById('languageScreen').classList.remove('hidden');
      document.getElementById('detailScreen').classList.add('hidden');
      document.getElementById('homeBtn').classList.add('hidden');
      window.scrollTo(0, 0);
    }

    function selectLanguage(langKey) {
      currentLangKey = langKey;
      currentCategory = 'greetings';
      currentMode = 'native';

      const langData = database[langKey];
      document.getElementById('detailFlag').innerText = langData.flag;
      document.getElementById('detailLangName').innerText = langData.name;
      document.getElementById('detailLangSub').innerText = `${langData.englishName} • Convention Helper`;

      // Set Tab Left Title
      document.getElementById('tabNativeText').innerText = langData.name.toUpperCase();

      renderCategories();
      updateTabs();
      renderPhrases();

      document.getElementById('languageScreen').classList.add('hidden');
      document.getElementById('detailScreen').classList.remove('hidden');
      document.getElementById('homeBtn').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function renderCategories() {
      const lang = database[currentLangKey];
      const container = document.getElementById('categoryContainer');
      container.innerHTML = '';

      const catKeys = [
        { id: 'greetings', icon: 'fa-handshake' },
        { id: 'everyday', icon: 'fa-comments' },
        { id: 'getting_around', icon: 'fa-compass' },
        { id: 'ministry_skills', icon: 'fa-book-open' }
      ];

      catKeys.forEach(cat => {
        const isActive = currentCategory === cat.id;
        const btn = document.createElement('button');
        btn.onclick = () => {
          currentCategory = cat.id;
          renderCategories();
          renderPhrases();
        };

        btn.className = `p-3 rounded-xl border text-left flex flex-col justify-between transition ${
          isActive 
            ? 'bg-indigo-600 text-white border-indigo-600 shadow' 
            : 'bg-white text-slate-700 border-slate-200 hover:border-indigo-400'
        }`;

        btn.innerHTML = `
          <div class="flex justify-between items-center w-full mb-1">
            <i class="fa-solid ${cat.icon} text-sm ${isActive ? 'text-indigo-200' : 'text-slate-400'}"></i>
          </div>
          <span class="text-xs font-bold leading-tight">${lang.categories[cat.id]}</span>
        `;
        container.appendChild(btn);
      });
    }

    function setMode(mode) {
      currentMode = mode;
      updateTabs();
      renderPhrases();
    }

    function updateTabs() {
      const tabNative = document.getElementById('tabNative');
      const tabEnglish = document.getElementById('tabEnglish');
      const desc = document.getElementById('modeDescription');
      const lang = database[currentLangKey];

      if (currentMode === 'native') {
        tabNative.className = 'flex-1 py-2.5 rounded-lg transition text-center shadow-sm bg-white text-indigo-700 font-bold';
        tabEnglish.className = 'flex-1 py-2.5 rounded-lg transition text-center text-slate-600 hover:text-slate-900';
        desc.innerText = `Showing for ${lang.name} speakers: English is prominent with native phonetics.`;
      } else {
        tabEnglish.className = 'flex-1 py-2.5 rounded-lg transition text-center shadow-sm bg-white text-indigo-700 font-bold';
        tabNative.className = 'flex-1 py-2.5 rounded-lg transition text-center text-slate-600 hover:text-slate-900';
        desc.innerText = `Showing for English speakers: ${lang.name} is prominent with English phonetics.`;
      }
    }

    function speakText(text, langCode) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        if (langCode) utterance.lang = langCode;
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    function renderPhrases() {
      const container = document.getElementById('phrasesList');
      container.innerHTML = '';
      const list = database[currentLangKey].data[currentCategory];
      const lang = database[currentLangKey];

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'phrase-card bg-white border border-slate-200 rounded-xl p-4 shadow-sm relative flex flex-col justify-between';

        if (currentMode === 'native') {
          // Left Tab:
          // 1. native language expression: smaller font, italicized
          // 2. English expression: larger font, bold
          // 3. English expression spelled phonetically in the chosen language
          card.innerHTML = `
            <div class="space-y-1">
              <p class="text-xs text-slate-500 italic">${item.tr}</p>
              <h3 class="text-lg font-bold text-slate-900">${item.en}</h3>
              <p class="text-sm font-semibold text-indigo-600 tracking-wide">🗣️ [ ${item.phNative} ]</p>
            </div>
            <div class="mt-3 pt-2 border-t border-slate-100 flex justify-end">
              <button onclick="speakText('${item.en.replace(/'/g, "\\'")}', 'en-US')" class="text-xs bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 px-3 py-1 rounded-md transition flex items-center gap-1">
                <i class="fa-solid fa-volume-high"></i> Listen (EN)
              </button>
            </div>
          `;
        } else {
          // Right Tab:
          // 1. English expression: smaller font, italicized
          // 2. native language expression: larger font, bold
          // 3. chosen language expression spelled phonetically in English
          card.innerHTML = `
            <div class="space-y-1">
              <p class="text-xs text-slate-500 italic">${item.en}</p>
              <h3 class="text-lg font-bold text-slate-900">${item.tr}</h3>
              <p class="text-sm font-semibold text-indigo-600 tracking-wide">🗣️ [ ${item.phEng} ]</p>
            </div>
            <div class="mt-3 pt-2 border-t border-slate-100 flex justify-end">
              <button onclick="speakText('${item.tr.replace(/'/g, "\\'")}', '${lang.code}')" class="text-xs bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 px-3 py-1 rounded-md transition flex items-center gap-1">
                <i class="fa-solid fa-volume-high"></i> Listen (${lang.englishName})
              </button>
            </div>
          `;
        }

        container.appendChild(card);
      });
    }
  </script>
