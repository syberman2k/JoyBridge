  <script>
    // --- 1. DARK / LIGHT THEME LOGIC ---
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun';
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-moon';
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
      updateTabs();
      renderCategories();
    }

    initTheme();

    // --- 2. PWA SERVICE WORKER & INSTALL PROMPT LOGIC ---
    let deferredPrompt;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('installBtn');
      if (installBtn) installBtn.classList.remove('hidden');
    });

    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          const installBtn = document.getElementById('installBtn');
          if (installBtn) installBtn.classList.add('hidden');
        });
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registered. Scope:', reg.scope))
          .catch(err => console.error('Service Worker registration failed:', err));
      });
    }

            { en: "We’re inviting people to try a free Bible lesson.", tr: "Zapraszamy do wypróbowania bezpłatnej lekcji biblijnej.", phNative: "Łir inwajtyng pipul tu traj e fri bajbl lesyn.", phEng: "zah-prah-SHAH-my doh vy-proo-boh-VAH-nyah bez-PWAHT-ney LEK-tsyi beeb-LEEY-ney." },
            { en: "Have you ever tried studying the Bible?", tr: "Czy próbowałeś kiedyś poznawać Biblię?", phNative: "Hew ju ewer trajd stadying de bajbl?", phEng: "Chy proo-boh-VAH-wesh KYEH-dyshpohz-NAH-vahch BEEB-lyeh?" },
            { en: "This course can help you understand the Bible.", tr: "Ten kurs może ci pomóc zrozumieć Biblię.", phNative: "Dys kors ken help ju ander-stend de bajbl.", phEng: "Ten koors MOH-zheh chee POH-moots zroh-ZOO-myech BEEB-lyeh." },
            { en: "It answers important questions about life and the future.", tr: "Odpowiada na ważne pytania dotyczące życia i przyszłości.", phNative: "Yt ansers importynt kłeszczyns ebałt lajf end de fiuczer.", phEng: "Oht-poh-VYAH-dah nah VAHZH-neh py-TAH-nyah doh-ty-CHOHN-tseh ZHY-chyah ee pshy-SHWOHSH-chee." },
            { en: "There is no charge and no obligation.", tr: "Kurs jest bezpłatny i do niczego nie zobowiązuje.", phNative: "Der yz noł czardż end noł obligejszyn.", phEng: "Koors yest bez-PWAHT-ny ee doh nee-CHEH-goh nyeh zoh-boh-vyon-ZOO-yeh." },
            { en: "You can choose the time and place.", tr: "Możesz sam wybrać czas i miejsce.", phNative: "Ju ken czuz de tajm end plejs.", phEng: "MOH-zhesh sahm VY-brahch chahs ee MYEY-stseh." },
            { en: "It can be done in person or by video call.", tr: "Może odbywać się osobiście lub przez wideorozmowę.", phNative: "Yt ken bi dan yn persyn or baj widijo kol.", phEng: "MOH-zheh oht-by-VAHCH shyeh oh-soh-BEESH-chyeh loob pshez vee-deh-oh-rohz-MOH-veh." },
            { en: "Even a few minutes each week is fine.", tr: "Wystarczy nawet kilka minut w tygodniu.", phNative: "Iwen e fiu mynyts icz łik yz fajn.", phEng: "vys-TAHR-chy NAH-vet KEEL-kah MEE-noot v ty-GOHD-nyoo." },
            { en: "May I show you how the course works?", tr: "Czy mogę ci pokazać, jak wygląda ten kurs?", phNative: "Mej aj szoł ju hał de kors łerks?", phEng: "Chy MOH-geh chee poh-KAH-zahch, yahk vy-GLOHN-dah ten koors?" },
            { en: "This demonstration will take only a few minutes.", tr: "Zajmie to tylko kilka minut.", phNative: "Dys demonstrejszyn łyl tejk onli e fiu mynyts.", phEng: "ZAY-myeh toh TYL-koh KEEL-kah MEE-noot." }
          ]
        }

        data: {

            { en: "Good morning", tr: "ಶುಭೋದಯ", phNative: "ಗುಡ್ ಮಾರ್ನಿಂಗ್", phEng: "shoo-BHOH-duh-yuh" },
            { en: "My name is...", tr: "ನನ್ನ ಹೆಸರು...", phNative: "ಮೈ ನೇಮ್ ಈಸ್...", phEng: "NUHN-nuh HEH-suh-roo..." },
            { en: "Nice to meet you", tr: "ನಿಮ್ಮನ್ನು ಭೇಟಿಯಾಗಿದ್ದು ಸಂತೋಷ", phNative: "ನೈಸ್ ಟು ಮೀಟ್ ಯು", phEng: "neem-MUHN-noo bhay-tee-YAH-gid-doo sahn-TOH-shuh" },

            { en: "You're welcome", tr: "ಪರವಾಗಿಲ್ಲ", phNative: "ಯುವರ್ ವೆಲ್ಕಮ್", phEng: "puh-ruh-vah-GEEL-luh" },
            { en: "Excuse me", tr: "ಕ್ಷಮಿಸಿ", phNative: "ಎಕ್ಸ್‌ಕ್ಯೂಸ್ ಮಿ", phEng: "kshu-MEE-see" },

          getting_around: [

            { en: "How much is this?", tr: "ಇದರ ಬೆಲೆ ಎಷ್ಟು?", phNative: "ಹೌ ಮಚ್ ಈಸ್ ದಿಸ್?", phEng: "EE-duh-ruh BEH-lay ESH-too?" },

            { en: "I don't understand", tr: "ನನಗೆ ಅರ್ಥವಾಗುತ್ತಿಲ್ಲ", phNative: "ಐ ಡೋಂಟ್ ಅಂಡರ್‌‌ಸ್ಟಾಂಡ್", phEng: "nuh-NUH-gay ahr-thuh-vah-GOOT-teel-luh" },
            { en: "What time is it?", tr: "ಸಮಯ ಎಷ್ಟು?", phNative: "ವಾಟ್ ಟೈಮ್ ಈಸ್ ಇಟ್?", phEng: "suh-muh-yuh ESH-too?" }
          ],
          ministry_skills: [
            { en: "We’re offering a free Bible course this month.", tr: "ನಾವು ಈ ತಿಂಗಳು ಉಚಿತ ಬೈಬಲ್ ಕೋರ್ಸ್ ನೀಡುತ್ತಿದ್ದೇವೆ.", phNative: "ವಿ ಆರ್ ಆಫರಿಂಗ್ ಎ ಫ್ರೀ ಬೈಬಲ್ ಕೋರ್ಸ್ ದಿಸ್ ಮಂತ್.", phEng: "NAH-voo ee TEEN-guhl-oo oo-chee-tuh BY-buhl kohrs nee-doot-TEED-day-vay." },
            { en: "Would you be interested in a free Bible study?", tr: "ನೀವು ಉಚಿತ ಬೈಬಲ್ ಅಧ್ಯಯನದಲ್ಲಿ ಆಸಕ್ತಿ ಹೊಂದಿದ್ದೀರಾ?", phNative: "ವುಡ್ ಯು ಬಿ ಇಂಟರೆಸ್ಟೆಡ್ ಇನ್ ಎ ಫ್ರೀ ಬೈಬಲ್ ಸ್ಟಡಿ?", phEng: "NEE-voo oo-chee-tuh BY-buhl ahd-yuh-nuh-duhl-lee AH-suhk-tee hon-deed-DEE-rah?" },
            { en: "We’re inviting people to try a free Bible lesson.", tr: "ಉಚಿತ ಬೈಬಲ್ ಪಾಠವನ್ನು ಪ್ರಯತ್ನಿಸಲು ನಾವು ಜನರನ್ನು ಆಹ್ವಾನಿಸುತ್ತಿದ್ದೇವೆ.", phNative: "ವಿ ಆರ್ ಇನ್ವೈಟಿಂಗ್ ಪೀಪಲ್ ಟು ಟ್ರೈ ಎ ಫ್ರೀ ಬೈಬಲ್ ಲೆಸನ್.", phEng: "oo-chee-tuh BY-buhl PAH-tuh-wuhn-noo pruh-yuht-nee-suhl-oo NAH-voo juh-nuh-RUHN-noo ah-wah-nee-soot-TEED-day-vay." },
            { en: "Have you ever tried studying the Bible?", tr: "ನೀವು ಎಂದಾದರೂ ಬೈಬಲ್ ಕಲಿಯಲು ಪ್ರಯತ್ನಿಸಿದ್ದೀರಾ?", phNative: "ಹ್ಯಾವ್ ಯು ಎವರ್ ಟ್ರೈಡ್ ಸ್ಟಡಿಯಿಂಗ್ ದ ಬೈಬಲ್?", phEng: "NEE-voo en-dah-duh-ROO BY-buhl kuh-lee-yuhl-oo pruh-yuht-nee-seed-DEE-rah?" },
            { en: "This course can help you understand the Bible.", tr: "ಈ ಕೋರ್ಸ್ ನಿಮಗೆ ಬೈಬಲ್ ಅರ್ಥಮಾಡಿಕೊಳ್ಳಲು ಸಹಾಯ ಮಾಡುತ್ತದೆ.", phNative: "ದಿಸ್ ಕೋರ್ಸ್ ಕ್ಯಾನ್ ಹೆಲ್ಪ್ ಯು ಅಂಡರ್‌ಸ್ಟಾಂಡ್ ದ ಬೈಬಲ್.", phEng: "ee kohrs nee-MUH-gay BY-buhl ahr-thuh-mah-dee-kohl-luhl-oo suh-HAH-yuh mah-doot-tuh-day." },
            { en: "It answers important questions about life and the future.", tr: "ಇದು ಜೀವನ ಮತ್ತು ಭವಿಷ್ಯದ ಬಗ್ಗೆ ಪ್ರಮುಖ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸುತ್ತದೆ.", phNative: "ಇಟ್ ಆನ್ಸರ್ಸ್ ಇಂಪಾರ್ಟೆಂಟ್ ಕ್ವೆಶ್ಚನ್ಸ್ ಅಬೌಟ್ ಲೈಫ್ ಅಂಡ್ ದ ಫ್ಯೂಚರ್.", phEng: "ee-DOO jee-vuh-nuh muht-too bhuh-VEESH-yuh-duh buhg-gay pruh-moo-khuh pruhsh-nay-gluh-GAY oot-tuh-ree-soot-tuh-day." },
            { en: "There is no charge and no obligation.", tr: "ಇದು ಸಂಪೂರ್ಣ ಉಚಿತ ಮತ್ತು ಯಾವುದೇ ಕಡ್ಡಾಯವಿಲ್ಲ.", phNative: "ದೇರ್ ಈಸ್ ನೋ ಚಾರ್ಜ್ ಅಂಡ್ ನೋ ಆಬ್ಲಿಗೇಷನ್.", phEng: "ee-DOO suhm-POOR-nuh oo-chee-tuh muht-too yah-vood-day kuhd-dah-yuh-VEEL-luh." },
            { en: "You can choose the time and place.", tr: "ನೀವೇ ಸಮಯ ಮತ್ತು ಸ್ಥಳವನ್ನು ಆಯ್ಕೆ ಮಾಡಬಹುದು.", phNative: "ಯು ಕ್ಯಾನ್ ಚೂಸ್ ದ ಟೈಮ್ ಅಂಡ್ ಪ್ಲೇಸ್.", phEng: "nee-VAY suh-muh-yuh muht-too sthl-wuhn-noo EYE-kay mah-duh-boo-doo." },
            { en: "It can be done in person or by video call.", tr: "ಇದನ್ನು ನೇರವಾಗಿ ಅಥವಾ ವಿಡಿಯೋ ಕಾಲ್ ಮೂಲಕ ಮಾಡಬಹುದು.", phNative: "ಇಟ್ ಕ್ಯಾನ್ ಬಿ ಡನ್ ಇನ್ ಪರ್ಸನ್ ಆರ್ ಬೈ ವಿಡಿಯೋ ಕಾಲ್.", phEng: "ee-duhn-noo NAY-ruh-wah-gee uh-thuh-wah VEE-dee-yoh kahl moo-luh-kuh mah-duh-boo-doo." },
            { en: "Even a few minutes each week is fine.", tr: "ಪ್ರತಿ ವಾರ ಕೆಲವೇ ನಿಮಿಷಗಳು ಸಾಕು.", phNative: "ಈವನ್ ಎ ಫ್ಯೂ ಮಿನಿಟ್ಸ್ ಈಚ್ ವೀಕ್ ಈಸ್ ಫೈನ್.", phEng: "pruh-tee VAH-ruh keh-luh-VAY nee-mee-shuh-gl-oo SAH-koo." },
            { en: "May I show you how the course works?", tr: "ಕೋರ್ಸ್ ಹೇಗೆ ನಡೆಯುತ್ತದೆ ಎಂದು ನಾನು ನಿಮಗೆ ತೋರಿಸಲೇ?", phNative: "ಮೇ ಐ ಶೋ ಯು ಹೌ ದ ಕೋರ್ಸ್ ವರ್ಕ್ಸ್?", phEng: "kohrs hay-GAY nuh-dey-yoot-tuh-day en-doo NAH-noo nee-muh-gay toh-ree-suh-LAY?" },
            { en: "This demonstration will take only a few minutes.", tr: "ಈ ಪ್ರಾತ್ಯಕ್ಷಿಕೆ ಕೆಲವೇ ನಿಮಿಷಗಳನ್ನು ತೆಗೆದುಕೊಳ್ಳುತ್ತದೆ.", phNative: "ದಿಸ್ ಡೆಮೊನ್‌‌ಸ್ಟ್ರೇಷನ್ ವಿಲ್ ಟೇಕ್ ಓನ್ಲಿ ಎ ಫ್ಯೂ ಮಿನಿಟ್ಸ್.", phEng: "ee praht-yuhk-shee-kay keh-luh-VAY nee-mee-shuh-gluhn-noo teh-gay-dhoo-kohl-loot-tuh-day." }
          ]
        }

            { en: "You can choose the time and place.", tr: "ತುಮಿಚ್ ವೇಳ್ ಆನಿ ಜಾಗೊ ವಿಂಚ್ಯೆತ್.", phNative: "ಯು ಕ್ಯಾನ್ ಚೂಸ್ ದ ಟೈಮ್ ಅಂಡ್ ಪ್ಲೇಸ್.", phEng: "too-MEECH vayl ah-NEE jah-GOH veen-chyet." },
            { en: "It can be done in person or by video call.", tr: "ಹೆಂ ಖುದ್ದ್ ಮೆಳುನ್ ವಾ ವಿಡಿಯೋ ಕೊಲ್ ಮುಖಾಂತ್ರ್ ಕರ್ಯೆತ್.", phNative: "ಇಟ್ ಕ್ಯಾನ್ ಬಿ ಡನ್ ಇನ್ ಪರ್ಸನ್ ಆರ್ ಬೈ ವಿಡಿಯೋ ಕಾಲ್.", phEng: "hem KHOOD-doo meh-WOON vah VEE-dee-yoh kohl moo-KHAHN-truh kur-yet." },

            { en: "May I show you how the course works?", tr: "ಹೊ ಕೋರ್ಸ್ ಕಸೊ ಚಲ್ತಾ ಮ್ಹಣ್ ಹಾಂವ್ ತುಮ್ಕಾಂ ದಾಕಂವ್ವೇ?", phNative: "ಮೇ ಐ ಶೋ ಯು ಹೌ ದ ಕೋರ್ಸ್ ವರ್ಕ್ಸ್?", phEng: "hoh kohrs kuh-SOH chuhl-TAH mhun HAHMV toom-KAHM dah-kuhmv-VAY?" },
            { en: "This demonstration will take only a few minutes.", tr: "ಹೆಂ ದಾಕಂವ್ಕ್ ಕೇವಲ್ ಥೊಡಿಂಚ್ ಮಿನುಟಾಂ ಲಾಗ್ತೆಲಿಂ.", phNative: "ದಿಸ್ ಡೆಮೊನ್‌ಸ್ಟ್ರೇಷನ್ ವಿಲ್ ಟೇಕ್ ಓನ್ಲಿ ಎ ಫ್ಯೂ ಮಿನಿಟ್ಸ್.", phEng: "hem dah-kuhmvk kay-VUHL thoh-deemch mee-noo-TAHM lahg-teh-LEEM." }
          ]

            { en: "What time is it?", tr: "现在几点？", phNative: "瓦特 泰姆 伊兹 伊特 (Wǎ-tè tài-mǔ yī-zī yī-tè)", phEng: "SHYEN-DZYE JEE DYEHN?" }
          ],
          ministry_skills: [
            { en: "We’re offering a free Bible course this month.", tr: "我们这个月提供免费的圣经课程。", phNative: "威尔 奥弗令 额 弗瑞 拜伯 阔斯 迪斯 忙斯", phEng: "WOH-muhn JHAY-guh YWEH TEE-goong MYEN-fay duh SHUNG-jeeng KUH-chuhng." },
            { en: "Would you be interested in a free Bible study?", tr: "你对免费学习圣经感兴趣吗？", phNative: "乌德 尤 必 因特瑞斯提德 因 额 弗瑞 拜伯 斯塔迪", phEng: "NEE DWAY MYEN-fay SHYWEH-shee SHUNG-jeeng GAHN SHING-chyoo MAH?" },
            { en: "We’re inviting people to try a free Bible lesson.", tr: "我们邀请人体验一堂免费的圣经课。", phNative: "威尔 因歪廷 批剖 吐 揣 额 弗瑞 拜伯 来森", phEng: "WOH-muhn YOW-cheeng RUHN TEE-yehn YEE-tahng MYEN-fay duh SHUNG-jeeng KUH." },
            { en: "Have you ever tried studying the Bible?", tr: "你以前有学习过圣经吗？", phNative: "汉夫 尤 挨窝 揣德 斯塔迪硬 泽 拜伯", phEng: "NEE YEE-chyehn YOH SHYWEH-shee GWOH SHUNG-jeeng MAH?" },
            { en: "This course can help you understand the Bible.", tr: "这个课程能帮助你明白圣经。", phNative: "迪斯 阔斯 看 海普 尤 安德斯坦德 泽 拜伯", phEng: "JHAY-guh KUH-chuhng NUNG BAHNG-joo NEE MING-by SHUNG-jeeng." },
            { en: "It answers important questions about life and the future.", tr: "它能解答关于人生和未来的重要问题。", phNative: "伊特 安瑟斯 音剖特恩特 阔斯臣斯 阿包特 来福 恩德 泽 퓨처", phEng: "TAH NUNG JYEH-dah GWAHN-yoo RUHN-shuhng HUH WAY-lye duh JOONG-yow WUN-tee." },
            { en: "There is no charge and no obligation.", tr: "完全免费，没有任何约束。", phNative: "泽尔 伊兹 诺 恰芝 恩德 诺 欧伯利给讯", phEng: "WAHN-chywen MYEN-fay, MAY-yoh RUHN-huh YWEH-shoo." },
            { en: "You can choose the time and place.", tr: "你可以自由选择时间和地点。", phNative: "尤 看 丘兹 泽 泰姆 恩德 普雷斯", phEng: "NEE KEE-yee DZU-yoh SHYWEN-zuh SHUH-jyehn HUH DEE-dyehn." },
            { en: "It can be done in person or by video call.", tr: "可以通过面对面或视频通话来进行。", phNative: "伊特 看 必 当 因 剖森 或 拜 威第欧 靠", phEng: "KEE-yee TOONG-gwoh MYEN-dway-MYEN HWOH SHUH-peen TOONG-hwah LYEE JEEN-sheeng." },
            { en: "Even a few minutes each week is fine.", tr: "每周即使只花几分钟也可以。", phNative: "依温 额 퓨 迷你茨 一起 威克 伊兹 放", phEng: "MAY-joh JEE-shuh JHUR HWAH JEE FUN-joong YEH KEE-yee." },
            { en: "May I show you how the course works?", tr: "我可以向你示范一下课程是怎么进行的吗？", phNative: "妹 艾 秀 尤 豪 泽 阔斯 沃克斯", phEng: "WOH KEE-yee SHYAHNG NEE SHUH-fahn YEE-syah KUH-chuhng SHUH DZEN-muh JEEN-sheeng duh MAH?" },
            { en: "This demonstration will take only a few minutes.", tr: "这个示范只需要几分钟时间。", phNative: "迪斯 德蒙斯特雷讯 威尔 忒克 欧恩利 额 퓨 迷你茨", phEng: "JHAY-guh SHUH-fahn JHEE SHYEE-yow JEE FUN-joong SHUH-jyehn." }
          ]
        }
      }
    };

    let currentLangKey = 'german';
    let currentCategory = 'greetings';
    let currentMode = 'native';

    function goToHome() {
      document.getElementById('languageScreen').classList.remove('hidden');
      document.getElementById('detailScreen').classList.add('hidden');
      document.getElementById('homeBtn').classList.add('hidden');
      window.scrollTo(0, 0);
    }

    function selectLanguage(langKey) {
      currentLangKey = langKey;
      currentCategory = 'greetings';
      currentMode = 'native';

      const langData = database[langKey];
      document.getElementById('detailFlag').innerText = langData.flag;
      document.getElementById('detailLangName').innerText = langData.name;
      document.getElementById('detailLangSub').innerText = `${langData.englishName} • Convention Language Helper`;

      // Set Tab Left Title
      document.getElementById('tabNativeText').innerText = langData.name.toUpperCase();

      renderCategories();
      updateTabs();
      renderPhrases();

      document.getElementById('languageScreen').classList.add('hidden');
      document.getElementById('detailScreen').classList.remove('hidden');
      document.getElementById('homeBtn').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function renderCategories() {
      const lang = database[currentLangKey];
      const container = document.getElementById('categoryContainer');
      container.innerHTML = '';

      const catKeys = [
        { id: 'greetings', icon: 'fa-handshake' },
        { id: 'everyday', icon: 'fa-comments' },
        { id: 'getting_around', icon: 'fa-compass' },
        { id: 'ministry_skills', icon: 'fa-book-open' }
      ];

      catKeys.forEach(cat => {
        const isActive = currentCategory === cat.id;
        const btn = document.createElement('button');
        btn.onclick = () => {
          currentCategory = cat.id;
          renderCategories();
          renderPhrases();
        };

        btn.className = `p-3 rounded-xl border text-left flex flex-col justify-between transition ${
          isActive 
            ? 'bg-indigo-600 text-white border-indigo-600 shadow' 
            : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700 hover:border-indigo-400'
        }`;

        btn.innerHTML = `
          <div class="flex justify-between items-center w-full mb-1">
            <i class="fa-solid ${cat.icon} text-sm ${isActive ? 'text-indigo-200' : 'text-slate-400 dark:text-slate-500'}"></i>
          </div>
          <span class="text-xs font-bold leading-tight">${lang.categories[cat.id]}</span>
        `;
        container.appendChild(btn);
      });
    }

    function setMode(mode) {
      currentMode = mode;
      updateTabs();
      renderPhrases();
    }

    function updateTabs() {
      const tabNative = document.getElementById('tabNative');
      const tabEnglish = document.getElementById('tabEnglish');
      const desc = document.getElementById('modeDescription');
      const lang = database[currentLangKey];

      const activeClass = 'flex-1 py-2.5 rounded-lg transition text-center shadow-sm bg-white dark:bg-slate-700 text-indigo-700 dark:text-indigo-300 font-bold';
      const inactiveClass = 'flex-1 py-2.5 rounded-lg transition text-center text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white';

      if (currentMode === 'native') {
        tabNative.className = activeClass;
        tabEnglish.className = inactiveClass;
        desc.innerText = `Showing for ${lang.name} speakers: English is prominent with native phonetics.`;
      } else {
        tabEnglish.className = activeClass;
        tabNative.className = inactiveClass;
        desc.innerText = `Showing for English speakers: ${lang.name} is prominent with English phonetics.`;
      }
    }

    function speakText(text, langCode) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        if (langCode) utterance.lang = langCode;
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    function renderPhrases() {
      const container = document.getElementById('phrasesList');
      container.innerHTML = '';
      const list = database[currentLangKey].data[currentCategory];
      const lang = database[currentLangKey];

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'phrase-card bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-4 shadow-sm relative flex flex-col justify-between';

        if (currentMode === 'native') {
          card.innerHTML = `
            <div class="space-y-1">
              <p class="text-xs text-slate-500 dark:text-slate-400 italic">${item.tr}</p>
              <h3 class="text-lg font-bold text-slate-900 dark:text-white">${item.en}</h3>
              <p class="text-sm font-semibold text-indigo-600 dark:text-indigo-400 tracking-wide">🗣️ [ ${item.phNative} ]</p>
            </div>
            <div class="mt-3 pt-2 border-t border-slate-100 dark:border-slate-700/60 flex justify-end">
              <button onclick="speakText('${item.en.replace(/'/g, "\\'")}', 'en-US')" class="text-xs bg-slate-100 dark:bg-slate-700 hover:bg-indigo-50 dark:hover:bg-slate-600 hover:text-indigo-600 dark:hover:text-indigo-300 text-slate-600 dark:text-slate-200 px-3 py-1 rounded-md transition flex items-center gap-1">
                <i class="fa-solid fa-volume-high"></i> Listen (EN)
              </button>
            </div>
          `;
        } else {
          card.innerHTML = `
            <div class="space-y-1">
              <p class="text-xs text-slate-500 dark:text-slate-400 italic">${item.en}</p>
              <h3 class="text-lg font-bold text-slate-900 dark:text-white">${item.tr}</h3>
              <p class="text-sm font-semibold text-indigo-600 dark:text-indigo-400 tracking-wide">🗣️ [ ${item.phEng} ]</p>
            </div>
            <div class="mt-3 pt-2 border-t border-slate-100 dark:border-slate-700/60 flex justify-end">
              <button onclick="speakText('${item.tr.replace(/'/g, "\\'")}', '${lang.code}')" class="text-xs bg-slate-100 dark:bg-slate-700 hover:bg-indigo-50 dark:hover:bg-slate-600 hover:text-indigo-600 dark:hover:text-indigo-300 text-slate-600 dark:text-slate-200 px-3 py-1 rounded-md transition flex items-center gap-1">
                <i class="fa-solid fa-volume-high"></i> Listen (${lang.englishName})
              </button>
            </div>
          `;
        }

        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
